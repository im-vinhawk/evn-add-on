<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>EVN Vietnam demo card</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #111318;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --primary-color: #f59e0b;
      --card-background-color: #1c1c22;
      --ha-card-background: #1c1c22;
      --primary-text-color: #e8eaed;
      --secondary-text-color: #9aa0a6;
      --secondary-background-color: #2a2b32;
      --divider-color: rgba(255, 255, 255, 0.08);
      --ha-card-border-radius: 16px;
    }
    .shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 36px 36px;
    }
    .caption {
      display: none;
    }
    evn-vietnam-energy-card {
      display: block;
    }
    ha-card {
      display: block;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="shell">
    <p class="caption">Demo — synthetic EVN data, no live account</p>
    <evn-vietnam-energy-card id="card"></evn-vietnam-energy-card>
  </div>
  <script>
    class HaCard extends HTMLElement {}
    if (!customElements.get("ha-card")) customElements.define("ha-card", HaCard);
  </script>
  <script src="../../custom_components/evn_vietnam/www/evn-vietnam-energy-card.js"></script>
  <script>
    const daily = Array.from({ length: 30 }, (_, i) => {
      const day = i + 1;
      const date = `2026-07-${String(day).padStart(2, "0")}`;
      const consumption = [8.4, 9.1, 7.6, 10.2, 11.8, 9.7, 8.9, 12.4, 13.1, 10.8, 9.4, 8.2, 7.9, 14.6, 15.2, 11.3, 9.8, 10.5, 12.1, 8.7, 9.3, 11.0, 13.4, 12.8, 10.1, 9.6, 8.8, 11.7, 12.2, 10.4][i];
      return { date, consumption };
    });
    const bills = [
      { period: "Tháng 6/2026", total_kwh: 312.4, total_amount: 812450, is_paid: true },
      { period: "Tháng 5/2026", total_kwh: 298.1, total_amount: 764320, is_paid: true },
      { period: "Tháng 4/2026", total_kwh: 341.7, total_amount: 901210, is_paid: true },
    ];
    const month = daily.reduce((sum, row) => sum + row.consumption, 0);
    const card = document.getElementById("card");
    card.setConfig({
      type: "custom:evn-vietnam-energy-card",
      title: "Điện năng EVN",
      color_scheme: "amber",
      entity: "sensor.demo_month",
      cost_entity: "sensor.demo_cost",
      today_entity: "sensor.demo_today",
      yesterday_entity: "sensor.demo_yesterday",
      customer_views: [
        {
          id: "aggregate",
          label: "Tổng (demo)",
          entity: "sensor.demo_month",
          cost_entity: "sensor.demo_cost",
          today_entity: "sensor.demo_today",
          yesterday_entity: "sensor.demo_yesterday",
        },
        {
          id: "meter_a",
          label: "Mã KH demo A",
          entity: "sensor.demo_a_month",
          cost_entity: "sensor.demo_a_cost",
        },
      ],
    });
    card.hass = {
      states: {
        "sensor.demo_month": {
          state: String(month.toFixed(1)),
          attributes: {
            customer_code: "__aggregate__",
            selected_customer_codes: ["DEMO001", "DEMO002"],
            successful_customer_codes: ["DEMO001", "DEMO002"],
            daily_history: daily,
            monthly_history: bills,
            is_partial: false,
          },
        },
        "sensor.demo_cost": {
          state: "835000",
          attributes: {
            customer_code: "__aggregate__",
            selected_customer_codes: ["DEMO001", "DEMO002"],
            bills,
          },
        },
        "sensor.demo_today": { state: "10.4", attributes: { customer_code: "__aggregate__" } },
        "sensor.demo_yesterday": { state: "12.2", attributes: { customer_code: "__aggregate__" } },
        "sensor.demo_a_month": {
          state: "150.2",
          attributes: {
            customer_code: "DEMO001",
            daily_history: daily.map((row) => ({ ...row, consumption: row.consumption / 2 })),
            monthly_history: bills,
          },
        },
        "sensor.demo_a_cost": {
          state: "410000",
          attributes: { customer_code: "DEMO001", bills },
        },
      },
    };
  </script>
</body>
</html>
